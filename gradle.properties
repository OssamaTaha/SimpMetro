#org.gradle.java.home=C:\\Users\\osry\\scoop\\apps\\openjdk21\\current
#org.gradle.java.home=/home/vladni/.local/share/jdk/jdk-21.0.13.1+2
# High performance settings for 8-core CPU / 20GB RAM
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.vfs.watch=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.unsafe.configuration-cache=true

# Incremental Kotlin compilation
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.caching.enabled=true
kotlin.compiler.execution.strategy=daemon
# iOS cinterop needs Apple SDKs; build those targets on macOS.
kotlin.native.enableKlibsCrossCompilation=false
# Stop idle daemons after 30 minutes instead of three hours.
org.gradle.daemon.idletimeout=1800000
android.useAndroidX=true
android.enableJetifier=false
org.gradle.unsafe.configuration-cache=true
android.nonTransitiveRClass=true
# Performance improvements
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=false

# Suppress deprecated warnings
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,android.nonFinalResIds

# Increase timeouts for JitPack downloads
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000

# Set JDK to the one bundled with Android Studio (falls back to system JDK)
#org.gradle.java.home=/opt/android-studio/jbr

# Enable Gradle task output caching
org.gradle.caching=true

# Kotlin compilation performance
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.caching.enabled=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

appVersion=14.4.0
innerTubeXVersion=v0.13.0

kotlin.native.ignoreDisabledTargets=true
# ponytail: optimized per-module caches bound link memory; revisit whole-program LTO if profiling justifies its memory cost.
kotlin.native.binary.enableReleaseBinaryCache=true

# Share the iOS playback KVO protocol between device and simulator source sets.
kotlin.mpp.enableCInteropCommonization=true
